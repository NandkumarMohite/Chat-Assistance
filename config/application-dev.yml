targetIp: localhost
backend-bff: 8080
ollama: 11434

server:
  port: 3001
  node_env: development

ollama:
  model: "qwen2.5-coder:3b"


eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://comau:Comau123!@${targetIp}:30761/eureka/  


    loadbalancer:
      ribbon:
        enabled: false
    discovery:
      enabled: true
      client:
        simple:
          instances:
            BACKEND_BFF:
              - uri: http://${targetIp}:${backend-bff}    
            ollamaF:
              - uri: http://${targetIp}:${ollama}                  

logging:
  level: debug
