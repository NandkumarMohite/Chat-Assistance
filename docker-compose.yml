services:
  # 🤖 Ollama AI Microservice
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    volumes:
      - ollama_storage:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - chat-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu] # If you dont have GPU please remove this code while deploying from Deploy to capabilities

  # 💬 Comau Chat Assistant Microservice
  comauchatassistant:
    image: itdgtpconreg01cnr.azurecr.io/comauchatassistant:0.0.1_TC1 
    container_name: comauchatassistant
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_URL=http://ollama-service:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_ROUTER_MODEL=${OLLAMA_ROUTER_MODEL}
      - OLLAMA_ANALYZER_MODEL=${OLLAMA_ANALYZER_MODEL}
      # 🌍 Point this to your actual backend (External or Microservice)
      # This overrides the 'baseUrl' in api-registry.json
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - chat-network
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]  

networks:
  chat-network:
    driver: bridge

volumes:
  ollama_storage:
